<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result for Question {question_id}</title>
    <style>
        body {{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }}
        .container {{
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            border: 1px solid #dee2e6;
            padding: 30px; /* Increased padding for better spacing */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative; /* Needed for header positioning */
        }}
        .question-id-header {{
            padding: 12px 20px;
            margin: -30px -30px 25px -30px; /* Span the full width of the container */
            border-bottom: 1px solid #dee2e6;
            border-radius: 8px 8px 0 0; /* Match container's top corners */
            font-size: 1.15rem;
            font-weight: 600;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }}
        .question-id-header.correct {{
            background-color: #28a745; /* Green for correct */
        }}
        .question-id-header.incorrect {{
            background-color: #dc3545; /* Red for incorrect */
        }}
        .section {{
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e9ecef;
        }}
        .section:last-child {{
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 10px;
        }}
        .section h3 {{
            margin-top: 0;
            margin-bottom: 15px;
            color: #495057;
            font-size: 1.1rem;
            font-weight: 600;
        }}
        .image-gallery {{
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }}
        .image-gallery img {{
            max-width: 220px;
            height: auto;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }}
        .question {{
            font-size: 1.25rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 15px;
        }}
        .choices ul {{
            list-style-type: none;
            padding: 0;
        }}
        .choices li {{
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 5px;
        }}
        .model-answer {{
            margin-top: 15px;
            font-weight: bold;
            background-color: #f1f3f5;
            padding: 10px 15px;
            border-radius: 4px;
            border-left: 5px solid #495057;
        }}
        .ground-truth-display {{
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #f1f3f5;
            padding: 12px 15px;
            border-radius: 5px;
            border-left: 5px solid #28a745;
        }}
        .correctness-artifact {{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            background-color: #28a745;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50%;
            flex-shrink: 0;
        }}
        .ground-truth-text {{
            font-size: 1.1rem;
            font-weight: bold;
        }}
    </style>
</head>
<body>
    <div class="container">

        <div class="question-id-header {status_class}">
            <span>Question ID: {question_id}</span>
            <span>{status_text}</span>
        </div>

        <div class="section">
            <h3>Images</h3>
            <div class="image-gallery">
                {images_html}
            </div>
        </div>

        <div class="section">
            <h3>Question & Choices</h3>
            <div class="question">{question}</div>
            <div class="choices">
                {choices_html}
            </div>
        </div>

        <div class="section">
            <h3>Model's Reasoning & Answer</h3>
            <p>{reasoning}</p>
            <div class="model-answer">
                Model's Answer: {final_answer}
            </div>
        </div>

        <div class="section">
            <h3>Ground Truth</h3>
            <div class="ground-truth-display">
                <div class="ground-truth-text">{ground_truth_answer}</div>
            </div>
        </div>

    </div>
</body>
</html>
